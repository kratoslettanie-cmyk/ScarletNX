name: Build Android Mali

on:
  push:
    branches: [main]
    paths: [.github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mali-arm64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android ARM64 Mali
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    env:
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/28.2.13676358
    steps:
      - uses: actions/checkout@v7
        with:
          ref: c65e2a80d99e8c8313caf8385c9d1283d816f396
      - name: Apply verified Mali topology fix
        run: |
          python3 - <<'PY'
          import base64, hashlib, subprocess, zlib
          payload = """"""
          patch = zlib.decompress(base64.b64decode(payload))
          assert hashlib.sha256(patch).hexdigest() == "52db66651927cf80b55a98b7195ce6e135f72394c4fe9748f9d5634a83874074"
          subprocess.run(["git", "apply", "--check", "-"], input=patch, check=True)
          subprocess.run(["git", "apply", "-"], input=patch, check=True)
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "diff", "--stat"], check=True)
          PY
      - uses: actions/cache@v5
        with:
          path: .cache/cpm
          key: cpm-android-${{ hashFiles('cmake/dependencies.cmake') }}
          restore-keys: cpm-android-
      - uses: actions/cache/restore@v5
        id: llvm
        with:
          path: android-llvm/arm64-v8a
          key: android-llvm-arm64-v8a-${{ hashFiles('scripts/android-llvm.sh') }}-${{ env.ANDROID_NDK_ROOT }}
      - name: Install native build dependencies
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${ANDROID_NDK_ROOT##*/}"
          sudo apt-get update
          sudo apt-get install -y nasm ccache spirv-tools
      - name: Build LLVM for Android ARM64
        if: steps.llvm.outputs.cache-hit != 'true'
        run: scripts/android-llvm.sh arm64-v8a "$PWD/android-llvm/arm64-v8a"
      - uses: actions/cache/save@v5
        if: steps.llvm.outputs.cache-hit != 'true'
        with:
          path: android-llvm/arm64-v8a
          key: ${{ steps.llvm.outputs.cache-primary-key }}
      - name: Build corrected ARM64 APK
        run: |
          JAVA_HOME=$JAVA_HOME_21_X64 scripts/android-apk.sh "$PWD/build/android-arm64-v8a" "$PWD/android-llvm" arm64-v8a --             -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cp build/android-arm64-v8a/stage/gradle/outputs/apk/debug/ScarletNX-debug.apk ScarletNX-android-arm64-v8a-mali.apk
      - uses: actions/upload-artifact@v7
        with:
          name: ScarletNX-android-arm64-v8a-mali
          path: ScarletNX-android-arm64-v8a-mali.apk
          if-no-files-found: error
      - name: Android application unit tests
        run: |
          JAVA_HOME=$JAVA_HOME_21_X64 gradle -p dist/android testDebugUnitTest             -Pscarletnx.stage="$PWD/build/android-arm64-v8a/stage"
